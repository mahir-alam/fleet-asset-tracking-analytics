services:
  db:
    image: postgres:16-alpine
    container_name: fleet-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports:
      # Host 5433 -> container 5432, to avoid clashing with a local Postgres on 5432
      - "5433:5432"
    volumes:
      - fleet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fleet-pgdata:
